<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme System Test - Ano Platform</title>
  <style>
    /* Light theme colors */
    :root.light,
    :root[data-theme='light'] {
      color-scheme: light;
      --primary-color: #646cff;
      --primary-hover: #535bf2;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-hover: #e0e0e0;
      --text-primary: #213547;
      --text-secondary: #4a5568;
      --border-primary: #e2e8f0;
      --success: #48bb78;
      --error: #f56565;
    }

    /* Dark theme colors */
    :root.dark,
    :root[data-theme='dark'] {
      color-scheme: dark;
      --primary-color: #818cf8;
      --primary-hover: #a5b4fc;
      --bg-primary: #1a1a1a;
      --bg-secondary: #242424;
      --bg-hover: #363636;
      --text-primary: rgba(255, 255, 255, 0.87);
      --text-secondary: rgba(255, 255, 255, 0.7);
      --border-primary: #3a3a3a;
      --success: #68d391;
      --error: #fc8181;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
      margin-bottom: 2rem;
    }

    .theme-toggle:hover {
      background-color: var(--primary-hover);
    }

    .test-section {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .test-section h2 {
      color: var(--text-primary);
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    .test-section p {
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      opacity: 0.8;
    }

    .input-group {
      margin-top: 1rem;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .status-badges {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .badge {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .badge-success {
      background-color: var(--success);
      color: white;
    }

    .badge-error {
      background-color: var(--error);
      color: white;
    }

    .current-theme {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: var(--bg-hover);
      color: var(--text-primary);
      border-radius: 4px;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    .test-results {
      margin-top: 2rem;
      padding: 1rem;
      background-color: var(--bg-secondary);
      border-radius: 8px;
    }

    .test-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      color: var(--text-secondary);
    }

    .test-item.pass::before {
      content: "✓";
      color: var(--success);
      font-weight: bold;
    }

    .test-item.fail::before {
      content: "✗";
      color: var(--error);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      Theme System Test
      <span class="current-theme" id="currentTheme">light</span>
    </h1>

    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
      Toggle Theme
    </button>

    <div class="test-section">
      <h2>Text and Typography</h2>
      <p>Primary text color should be clearly readable in both themes.</p>
      <p style="color: var(--text-secondary)">Secondary text is slightly muted but still readable.</p>
    </div>

    <div class="test-section">
      <h2>Buttons</h2>
      <div class="button-group">
        <button class="btn btn-primary">Primary Button</button>
        <button class="btn btn-secondary">Secondary Button</button>
      </div>
    </div>

    <div class="test-section">
      <h2>Form Inputs</h2>
      <div class="input-group">
        <input type="text" placeholder="Type something here..." />
      </div>
    </div>

    <div class="test-section">
      <h2>Status Indicators</h2>
      <div class="status-badges">
        <span class="badge badge-success">Success</span>
        <span class="badge badge-error">Error</span>
      </div>
    </div>

    <div class="test-results">
      <h2>Test Results</h2>
      <div id="testResults"></div>
    </div>
  </div>

  <script>
    // Initialize theme from localStorage or default to light
    function initTheme() {
      const savedTheme = localStorage.getItem('ano-theme-preference') || 'light';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      root.classList.remove('light', 'dark');
      root.classList.add(theme);
      root.setAttribute('data-theme', theme);
      
      document.getElementById('currentTheme').textContent = theme;
      document.getElementById('themeIcon').textContent = theme === 'light' ? '🌙' : '☀️';
      
      localStorage.setItem('ano-theme-preference', theme);
      runTests();
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(newTheme);
    }

    function runTests() {
      const results = [];
      const root = document.documentElement;
      const computedStyle = getComputedStyle(root);
      
      // Test 1: Theme class is applied
      const hasThemeClass = root.classList.contains('light') || root.classList.contains('dark');
      results.push({
        name: 'Theme class applied to root element',
        pass: hasThemeClass
      });
      
      // Test 2: Data attribute is set
      const hasDataAttr = root.getAttribute('data-theme') !== null;
      results.push({
        name: 'data-theme attribute is set',
        pass: hasDataAttr
      });
      
      // Test 3: CSS variables are defined
      const primaryColor = computedStyle.getPropertyValue('--primary-color').trim();
      results.push({
        name: 'CSS variables are defined',
        pass: primaryColor !== ''
      });
      
      // Test 4: localStorage is working
      const savedTheme = localStorage.getItem('ano-theme-preference');
      results.push({
        name: 'Theme saved to localStorage',
        pass: savedTheme !== null
      });
      
      // Test 5: Theme matches saved preference
      const currentTheme = root.classList.contains('dark') ? 'dark' : 'light';
      results.push({
        name: 'Current theme matches saved preference',
        pass: currentTheme === savedTheme
      });
      
      // Display results
      const resultsContainer = document.getElementById('testResults');
      resultsContainer.innerHTML = results.map(result => 
        `<div class="test-item ${result.pass ? 'pass' : 'fail'}">${result.name}</div>`
      ).join('');
    }

    // Initialize on load
    initTheme();
  </script>
</body>
</html>
